# The demo preset's composition. Every row runs in this preset's standing
# scope: the persona's prompt sections, the router's dynamic mode, the tools
# and skills registered by ./lib/tools.js, and the intake gate in
# ./lib/hooks.js reach exactly the agents joined to this preset.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are DEMO-ASSET-PERSONA, 平安集团的资产顾问助手 powered by the {{model}} model.
      回答用中文，称用户为「您」。
    suffix: Your working directory is {{cwd}}.

- id: boat-skill-router
  name: '@boat/skill-router/preset'
  config:
    mode: dynamic
    historyWindow: 6
    timeoutMs: 10000

- id: demo-tools
  name: ./lib/tools.js

- id: demo-hooks
  name: ./lib/hooks.js
