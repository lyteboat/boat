# The @boat/run bundle patch: one-shot task mode over dsh-base and @boat/host,
# boat's replacement for dsh-headless. The startup row parses the task and the
# `--agent` / `--agents` / `--history` flags from the inner arguments and
# publishes them as the `boatRunStartup` service; the agent-presets roster
# reads its roots from that service (no roots without `--agents`, so the
# roster's "every agent joins a preset" rule stays off); the runner row creates
# one agent — composed from the named agent directory — drives the task to
# quiescence, prints the final answer, and exits. boat's service rows and the
# driver come from @boat/host, listed before this bundle in the run profile.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: boat-run-startup
      name: '@boat/run/startup'

    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      inject: [boatRunStartup]
      config:
        default: !!js ctx.boatRunStartup.preset ?? 'none'
        roots: !!js "ctx.boatRunStartup.agentRoots.map(path => ({ path, trust: 'user' }))"
        includeShippedRoot: false
        includeUserRoot: false

    - id: boat-run
      name: '@boat/run'
      inject: [boatRunStartup]
      config:
        task: !!js ctx.boatRunStartup.task
        preset: !!js ctx.boatRunStartup.preset
        history: !!js ctx.boatRunStartup.history
