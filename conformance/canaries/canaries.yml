# G5 canaries: community plugins pinned by version, installed the way users install
# them (`dsh plugin --profile headless add <name>@<version>`) into the official release
# and into boat, then run the same scripted task (conformance/canaries/g5.spec.ts).
#
# How they were chosen (2026-09-23, dsh 0.1.7-rc.1): from the 600-package community
# sample, up to six host-side candidates per risk category (what a kernel change could
# break), preferring peer ranges that reach 0.1.6/0.1.7; a category left with fewer than
# three clean ones took the next candidates of the same ranking whose dsh peers admit
# the release (appends six more, projections its last one). 61 candidates were installed
# on the official release and run once; 31 installed, activated every row, answered, and
# exited. The other 30 are not canaries: they fail on the official release itself, either
# refused at install by its peer check (their dsh peers exclude 0.1.7-rc.1) or on 0.1.7's
# own changes (ctx.settings.register gone, agentPresets and webServer absent from a
# headless profile, typert registration), which is input for compat decisions, not for
# G5. dsh-pocket-console never exits. From the 31, up to three per category in ranking
# order; projections has two.
#
# bundle: true installs as a profile layer; false would add a row (none qualified).
canaries:
  - { name: deepseek-harness-zh_pro, version: 0.9.3, bundle: true, risk: persistence-files }
  - { name: dsh-git-ui, version: 0.2.1, bundle: true, risk: persistence-files }
  - { name: dsh-permission-rules, version: 0.7.4, bundle: true, risk: persistence-files }
  - { name: '@longnb47/dsh-agent-gateway', version: 0.1.0-rc.2, bundle: true, risk: appends }
  - { name: dsh-yogacara, version: 0.2.1, bundle: true, risk: appends }
  - { name: dsh-mermaid-comm, version: 0.2.0, bundle: true, risk: appends }
  - { name: dsh-wenmai, version: 0.8.0, bundle: true, risk: prompt }
  - { name: '@ukewea/dsh-taskboard', version: 0.7.0, bundle: true, risk: prompt }
  - { name: '@zzerx/dsh-plugin-memory', version: 0.3.1, bundle: true, risk: prompt }
  - { name: dsh-file-review-kcoder, version: 1.0.7, bundle: true, risk: tools-pre-execute }
  - { name: dsh-rate-shield, version: 0.1.0, bundle: true, risk: tools-pre-execute }
  - { name: dsh-survival-mode, version: 0.1.1, bundle: true, risk: tools-pre-execute }
  - { name: dsh-plugin-heartbeat, version: 0.4.2, bundle: true, risk: step }
  - { name: '@yadsh/dsh-kv-persist', version: 0.2.6, bundle: true, risk: llm }
  - { name: dsh-llm-gateway-compat, version: 0.4.0, bundle: true, risk: llm }
  - { name: dsh-inhibition, version: 0.1.2, bundle: true, risk: llm }
  - { name: dsh-context, version: 0.54.2, bundle: true, risk: projections }
  - { name: '@steven-wu/dsh-cost-meter', version: 0.1.0-rc.3, bundle: true, risk: projections }
  - { name: dsh-loom, version: 1.3.0, bundle: true, risk: tools }
  - { name: '@evaldock/dsh-top100-plugin', version: 1.3.11, bundle: true, risk: tools }
  - { name: '@hanphone/dsh-a2a', version: 0.3.3, bundle: true, risk: session-host }
  - { name: dsh-reminder, version: 0.1.4, bundle: true, risk: session-host }
  - { name: dsh-specline, version: 0.1.0, bundle: true, risk: session-host }
