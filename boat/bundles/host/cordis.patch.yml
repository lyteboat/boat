# The @boat/host bundle patch: what every boat profile shares, applied right
# after dsh-base. dsh-base's own agent-loop row stays: its package resolves to
# boat's kernel (dsh/core/agent-loop), which dispatches boat/intake and
# boat/pre-assemble. boat's service rows sit on the host plane, where agent
# rows inject them.

# dsh-base's session-log-deepseek row attaches each session's canonical log
# (`dsh_session_log`) to every official DeepSeek request unless told not to;
# boat sends the provider the model request only.
- id: session-log-deepseek
  config:
    enabled: false

- insert:
    - id: boat-tool-policy
      name: '@boat/tool-policy'

    - id: boat-skill-router
      name: '@boat/skill-router'

    - id: boat-a2ui
      name: '@boat/a2ui'

    - id: boat-history-import
      name: '@boat/history-import'
