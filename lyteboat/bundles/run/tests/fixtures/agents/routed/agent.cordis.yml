# Dynamic skill routing for every agent joined to this preset. Skills come
# from the workspace's project roots (the base skill-filesystem row); the
# router row only turns routing on, and the tool-policy row makes the official
# todo_write tool an `auto` tool a skill can require.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are ROUTED-PRESET-PERSONA, a test agent powered by the {{model}} model.
    suffix: Your working directory is {{cwd}}.

- id: lyteboat-tool-policy
  name: '@lyteboat/tool-policy/agent'
  config:
    tools:
      todo_write:
        visibility: auto

- id: lyteboat-skill-router
  name: '@lyteboat/skill-router/agent'
  config:
    mode: dynamic
    historyWindow: 6
    timeoutMs: 10000
