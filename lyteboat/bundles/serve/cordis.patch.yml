# The @lyteboat/serve bundle patch: lyteboat's service mode over dsh-base and
# @lyteboat/host. The startup row parses `--agents` / `--host` / `--port` /
# `--auth` / `--secret-env` / `--workspace` into the `lyteboatServeStartup`
# service; the agent catalog declares every agent of the roots; dsh's session
# controller runs without the web UI (workspace, connection, and file upload are
# its host services); the web server listens where startup says, and chat-api
# serves /chat, /agents, and /health on it. The last row reports the service
# once the catalog is ready, or stops it. lyteboat's service rows come from
# @lyteboat/host and the agent loop (lyteboat's kernel) from dsh-base, both
# listed before this bundle in the serve profile.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# A business caller's model requests carry its agent's conversation only: not the
# list of installed packages dsh-base attaches to requests on DeepSeek's route, and
# not the AGENTS.md of the server's working directory.
- id: plugin-package-inventory-deepseek
  disabled: true

- id: agent-instructions
  disabled: true

- insert:
    - id: lyteboat-serve-startup
      name: '@lyteboat/serve/startup'

    - id: agent-catalog
      name: '@lyteboat/agent-catalog'
      inject: [lyteboatServeStartup]
      config:
        roots: !!js ctx.lyteboatServeStartup.agentRoots

    # Every /chat session names its agent; a session without one runs none.
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: none

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: connection
      name: '@deepseek-ai/dsh-client-connection'

    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [lyteboatServeStartup]
      config:
        host: !!js ctx.lyteboatServeStartup.host
        port: !!js ctx.lyteboatServeStartup.port

    - id: chat-api
      name: '@lyteboat/chat-api'
      inject: [lyteboatServeStartup]
      config:
        auth: !!js ctx.lyteboatServeStartup.auth
        credentialRef: !!js ctx.lyteboatServeStartup.credentialRef
        workspace: !!js ctx.lyteboatServeStartup.workspace

    - id: lyteboat-serve
      name: '@lyteboat/serve'

# A service applies the user layers at startup only, as the headless mode does.
- id: hmr
  disabled: true
