# The @lyteboat/headless bundle patch: one-shot task mode over dsh-base and @lyteboat/host,
# lyteboat's replacement for dsh-headless. The startup row parses the task and the
# `--agent` / `--agents` / `--history` / `--session-id` / `--context` flags from
# the inner arguments, checks that an `--agents` root holds the agent, and
# publishes them as the `lyteboatHeadlessStartup` service; the agent catalog declares
# that agent to the agent preset registry from its root, and the runner row
# creates one agent composed from it (or resumes the stored session), drives the
# task to quiescence, prints the final answer, and exits. lyteboat's service rows
# come from @lyteboat/host, the agent loop (lyteboat's kernel) from dsh-base,
# and the business base from @lyteboat/business-base, all listed before this
# bundle in the headless profile.

- insert:
    - id: lyteboat-headless-startup
      name: '@lyteboat/headless/startup'

    - id: agent-catalog
      name: '@lyteboat/agent-catalog'
      inject: [lyteboatHeadlessStartup]
      config:
        roots: !!js ctx.lyteboatHeadlessStartup.agentRoots
        include: !!js "ctx.lyteboatHeadlessStartup.agent === undefined ? [] : [ctx.lyteboatHeadlessStartup.agent]"

    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      inject: [lyteboatHeadlessStartup]
      config:
        default: !!js ctx.lyteboatHeadlessStartup.agent ?? 'none'

    - id: lyteboat-headless
      name: '@lyteboat/headless'
      inject: [lyteboatHeadlessStartup]
      config:
        task: !!js ctx.lyteboatHeadlessStartup.task
        agent: !!js ctx.lyteboatHeadlessStartup.agent
        history: !!js ctx.lyteboatHeadlessStartup.history
        sessionId: !!js ctx.lyteboatHeadlessStartup.sessionId
        context: !!js ctx.lyteboatHeadlessStartup.context

# A one-shot run applies the user layers at startup only, as dsh-headless does.
- id: hmr
  disabled: true
