# business_hierarchy.yaml — named recombination variants for asset_overview.
#
# The model outputs ONE hierarchy name (enum); the engine maps it to {root, ui_ids}.
# Model-generated hide/order is NOT used. asset_overview's variation is entirely
# DATA-DRIVEN (auth_state × unauth_main_group_count × policy_count), computed in the manifest as
# hide booleans — so there is exactly ONE hierarchy here and the model need not
# pick anything.
#
# root-container is the designer root (main-card is its only child); ui_ids
# filters the ROOT's explicitList, hence it lists main-card, not the CTA ids.

default: asset_overview

hierarchies:
  asset_overview:
    root: root-container
    ui_ids:
      - main-card

# ──────────────────────────────────────────────────────────────────────────
# DATA-DRIVEN HIDE (manifest-computed, model never touches):
#   insurance-action-text-unauth  hide = insurance_unauth_hide  (policy_count>0)
#   insurance-action-text-auth    hide = insurance_auth_hide    (policy_count==0)
#   auth-btn  hide = auth_btn_hide   show iff  auth_state == "one"
#   diag-btn  hide = diag_btn_hide   show iff  auth_state in {multi,full}
#   auth-tip  hide = auth_tip_hide   show iff  主组未全 & auth_state in {multi,full}
#   (两颗橙色 CTA 互斥,整卡至多一颗;三条规则都不看 is_aigc)
