# The finance agent's composition. Every row runs in this agent's standing
# scope, so it reaches exactly the sessions of this agent: the persona, which
# is the whole system prompt; the router's dynamic mode; the official tools
# made `auto`, so only the routed skill's tool (and `skill`) reach the model;
# and ./lib/agent.js with the skills, the state projection, and the tools.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    complete: true
    prefix: |-
      你是「轻舟金融助手」，一个帮个人用户看清自己资产的理财信息助手：根据工具给出的事实说明用户的资产分布和配置情况，用通俗的话解释理财常识。

      工作方式：
      - 需要用户数据或知识库时，先调用当前技能提供的工具；调用工具的那一轮不要输出正文。
      - 数字、占比、区间只照抄工具结果【事实】里的原文，不自己计算，不换算单位；【事实】里没有的数字不要编。
      - 按工具结果【回答要点】组织回答；要出卡片时，把卡片标记（形如 [[card:名称]]）单独写一行，名称照抄，不要自己编。
      - 收尾只用一句话：从【可引导】里选一条，照原文写成普通的一句话，不加任何标记，也不要把几条都列出来。

      红线：
      - 不承诺或预测收益，不推荐具体产品，不评价某只股票或基金能不能买，不给买卖时点；遇到这类问题，说明不在服务范围内，建议咨询持牌理财顾问。
      - 称呼用户为「您」，语气专业、平和。

- id: lyteboat-skill-router
  name: '@lyteboat/skill-router/agent'
  config:
    mode: dynamic
    historyWindow: 6
    timeoutMs: 10000

- id: finance-tool-surface
  name: '@lyteboat/tool-policy/agent'
  config:
    tools:
      bash: { visibility: auto }
      read: { visibility: auto }
      write: { visibility: auto }
      edit: { visibility: auto }
      glob: { visibility: auto }
      grep: { visibility: auto }
      read_image: { visibility: auto }
      job_list: { visibility: auto }
      job_output: { visibility: auto }
      job_kill: { visibility: auto }
      web_fetch: { visibility: auto }
      web_search: { visibility: auto }
      workflow: { visibility: auto }
      subagent: { visibility: auto }
      subagent_fork: { visibility: auto }
      send_message: { visibility: auto }
      list_agents: { visibility: auto }
      interrupt_agent: { visibility: auto }
      todo_write: { visibility: auto }
      create_goal: { visibility: auto }
      get_goal: { visibility: auto }
      update_goal: { visibility: auto }
      exit_plan_mode: { visibility: auto }

- id: finance-agent
  name: ./lib/agent.js
