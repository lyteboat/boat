# manifest.yaml — bucket_detail: one bucket's share, judgement and accounts.
# The raw data namespace: { bucket: { title, share_text, judge, amount_text, accounts_text } },
# where judge is under / ok / over.

# `deferred`: the card sits where the answer writes [[card:bucket_detail]],
# or follows the answer when it never does.

emission_mode: deferred

paths:

  title:
    kind: state
    path: "bucket.title"

  share_text:
    kind: state
    path: "bucket.share_text"

  judge_text:
    kind: computed
    fn: judge_text
    args:
      - "state:bucket.judge"

  amount_text:
    kind: state
    path: "bucket.amount_text"

  accounts_text:
    kind: state
    path: "bucket.accounts_text"
