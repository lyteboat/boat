# manifest.yaml — allocation_plan: which way to move
# The raw data namespace: { plan: { direction, note } }.

# `deferred`: the card sits where the answer writes [[card:allocation_plan]],
# or follows the answer when it never does.

emission_mode: deferred

paths:

  direction:
    kind: state
    path: "plan.direction"

  note:
    kind: state
    path: "plan.note"
